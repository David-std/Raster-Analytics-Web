name: ONSV source inventory

on:
  push:
    branches: [data/onsv-ingestion]

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Download and inspect ONSV sources
        run: >-
          python -m pipelines.ingestion.onsv sync --all
          --output-dir /tmp/onsv
          --report /tmp/onsv-source-inventory.json
      - uses: actions/upload-artifact@v4
        with:
          name: onsv-source-inventory
          path: /tmp/onsv-source-inventory.json
          if-no-files-found: error
