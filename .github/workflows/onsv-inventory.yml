name: ONSV source validation

on:
  push:
    branches: [data/onsv-ingestion]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Download primary ONSV sources
        run: >-
          python -m pipelines.ingestion.onsv sync
          --output-dir /tmp/onsv
          --report /tmp/onsv-source-inventory.json
      - name: Build normalized pedestrian event dataset
        run: >-
          python -m pipelines.processing.onsv
          --raw-dir /tmp/onsv
          --output /tmp/lima-pedestrian-fatal-crashes.csv
      - name: Summarize normalized dataset
        run: |
          python - <<'PY'
          import csv
          import json
          from collections import Counter
          from pathlib import Path

          path = Path('/tmp/lima-pedestrian-fatal-crashes.csv')
          with path.open(encoding='utf-8', newline='') as source:
              rows = list(csv.DictReader(source))

          dates = [row['crash_date'] for row in rows if row['crash_date']]
          valid_coordinates = sum(
              bool(row['latitude']) and bool(row['longitude']) for row in rows
          )
          summary = {
              'rows': len(rows),
              'first_date': min(dates) if dates else None,
              'last_date': max(dates) if dates else None,
              'valid_coordinate_rows': valid_coordinates,
              'by_year': dict(sorted(Counter(row['year'] for row in rows).items())),
              'pedestrian_fatalities': sum(int(row['pedestrian_fatalities']) for row in rows),
              'pedestrian_injured': sum(int(row['pedestrian_injured']) for row in rows),
          }
          Path('/tmp/onsv-processing-summary.json').write_text(
              json.dumps(summary, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(summary, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: onsv-source-validation
          path: |
            /tmp/onsv-source-inventory.json
            /tmp/onsv-processing-summary.json
          if-no-files-found: error
